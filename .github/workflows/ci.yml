name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/box_inteligente_test
          JWT_SECRET: ci_jwt_secret_at_least_10_chars
          JWT_REFRESH_SECRET: ci_refresh_secret_at_least_10_chars
        run: npm test